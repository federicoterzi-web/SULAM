[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sulam"
version = "0.1.0"
description = "SULAM - Sistema Único de Legajos de Adultos Mayores (Dirección de Adultos Mayores de Tucumán)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "reportlab>=4",
    "segno>=1.6",
    "pillow>=10",
    # Lectura del PDF de la certificación negativa de ANSES.
    "pypdfium2>=4",
    # Excel de estadísticas y de incidencias de asistencia.
    "openpyxl>=3.1",
    # Brief de eventos y campañas para Comunicación (Word).
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Lectura automática de fichas fotografiadas.
lectura = ["opencv-python-headless>=4.9", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27", "pypdfium2>=4"]

[project.scripts]
sulam = "sulam.cli:main"

[tool.setuptools.packages.find]
include = ["sulam*"]

[tool.setuptools.package-data]
sulam = ["recursos/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
