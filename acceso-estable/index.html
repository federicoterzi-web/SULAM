<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SULAM</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3ec; color: #14304a; }
  main { max-width: 26rem; padding: 1.5rem; text-align: center; }
  a { color: #14304a; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>SULAM</h1>
  <p id="msg">Abriendo…</p>
  <p><a id="enlace" href="#">Si no se abre sola, tocá acá</a></p>
</main>
<script>
// ----------------------------------------------------------------------------
// UNICA LINEA A CAMBIAR cuando cambia la dirección real de SULAM:
// la dirección completa, con https:// y sin barra al final.
var DESTINO = "https://CAMBIAR-POR-LA-DIRECCION-ACTUAL.trycloudflare.com";
// ----------------------------------------------------------------------------
// El QR de cada caso trae «#/c/<número>»: el navegador conserva ese final
// al redirigir, así que se abre el mismo caso en la dirección actual.
(function () {
  var destino = DESTINO.replace(/\/+$/, "") + "/" + (location.hash || "");
  document.getElementById("enlace").href = destino;
  if (DESTINO.indexOf("CAMBIAR-POR") !== -1) {
    document.getElementById("msg").textContent = "Este acceso todavía no está configurado.";
    return;
  }
  location.replace(destino);
})();
</script>
</body>
</html>
